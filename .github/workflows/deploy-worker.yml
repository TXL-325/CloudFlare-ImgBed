name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      worker_name:
        description: 'Worker Name'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest

    # 仅 fork 仓库部署
    if: ${{ github.event.repository.fork }}

    steps:

      - name: Check deployment config
        id: check
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "CLOUDFLARE_API_TOKEN not configured, skipping Worker deployment"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi


      - name: Checkout
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v6


      - name: Setup Node.js
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'


      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: |
          npm ci \
            --workspace=@cloudflare-imgbed/common \
            --workspace=@cloudflare-imgbed/worker \
            --omit=dev


      - name: Generate worker routes
        if: steps.check.outputs.skip != 'true'
        run: |
          node deploy/worker/generate-routes.js


      - name: Generate wrangler config
        if: steps.check.outputs.skip != 'true'
        env:
          WORKER_NAME: ${{ inputs.worker_name || secrets.WORKER_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          WORKER_VARS: ${{ secrets.WORKER_VARS }}

        run: |
          node deploy/worker/generate-toml.js


      - name: Check generated config
        if: steps.check.outputs.skip != 'true'
        run: |
          echo "===== deploy/worker ====="
          ls -la deploy/worker

          echo "===== wrangler.toml ====="
          cat deploy/worker/wrangler.toml


      - name: Install Wrangler
        if: steps.check.outputs.skip != 'true'
        run: |
          npm install -g wrangler@4


      - name: Deploy to Cloudflare Workers
        if: steps.check.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

        run: |
          wrangler deploy \
            --config deploy/worker/wrangler.toml
